[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lazy-bird"
version = "2.0.0-alpha"
description = "Automate development projects with Claude Code - microservice architecture with FastAPI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Yusuf Karaaslan", email = "lazy-bird@proton.me"}
]
keywords = ["automation", "claude", "ai", "development", "devops", "ci-cd", "godot", "unity", "django", "react", "fastapi", "microservices"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
]

dependencies = [
    # FastAPI Core
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",

    # Database
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",

    # Validation
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.1.0",

    # Background Tasks
    "celery[redis]>=5.3.4",
    "redis>=5.0.1",

    # HTTP Client
    "httpx>=0.26.0",

    # Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",

    # Utilities
    "psutil>=5.9.6",
    "PyYAML>=6.0.1",
    "python-dateutil>=2.8.2",

    # Legacy v1.1 support (for gradual migration)
    "Flask>=3.0.0",
    "Flask-CORS>=4.0.0",
    "Flask-SocketIO>=5.3.5",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.3",
    "pytest-mock>=3.12.0",
    "httpx>=0.26.0",  # For testing FastAPI

    # Code Quality
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "bandit>=1.7.5",
    "isort>=5.13.2",

    # Type Stubs
    "types-PyYAML",
    "types-python-dateutil",
    "types-redis",
    "types-passlib",
]

web = [
    # All web dependencies are already in main dependencies
    # Frontend (Node.js) is managed separately via npm
]

all = [
    "lazy-bird[dev,web]",
]

[project.urls]
Homepage = "https://github.com/yusufkaraaslan/lazy-bird"
Documentation = "https://github.com/yusufkaraaslan/lazy-bird/blob/main/CLAUDE.md"
Repository = "https://github.com/yusufkaraaslan/lazy-bird"
Issues = "https://github.com/yusufkaraaslan/lazy-bird/issues"
Changelog = "https://github.com/yusufkaraaslan/lazy-bird/releases"

[project.scripts]
lazy-bird = "lazy_bird.cli:main"

[tool.setuptools]
packages = ["lazy_bird"]
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.package-data]
"*" = [
    "scripts/*.py",
    "scripts/*.sh",
    "config/*.yml",
    "config/*.yaml",
]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | node_modules
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=lazy_bird",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
