[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Logging
log_cli = false
log_cli_level = INFO

# Coverage settings (when using --cov)
addopts =
    --strict-markers
    --strict-config
    -ra

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may require services)
    slow: Slow tests (may take >5 seconds)
    scripts: Tests for scripts in scripts/ directory

# Test discovery
norecursedirs = .git .tox dist build *.egg node_modules web/frontend web/backend/venv

# Timeout for tests (optional, requires pytest-timeout)
# timeout = 300

# Minimum Python version
minversion = 7.0
