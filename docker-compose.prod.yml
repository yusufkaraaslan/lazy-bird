# Lazy-Bird v2.0 Production Docker Compose
# ==========================================
# Optimized for production deployment with security and performance tuning

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: lazy-bird-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: lazy_bird
      POSTGRES_USER: lazy_bird
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazy_bird -d lazy_bird"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # Security: No exposed ports (internal network only)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # Redis
  redis:
    image: redis:7-alpine
    container_name: lazy-bird-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # Security: No exposed ports
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: lazy-bird/api:${VERSION:-latest}
    container_name: lazy-bird-api-prod
    restart: always
    command: >
      gunicorn lazy_bird.api.main:app
      --workers 4
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --access-logfile -
      --error-logfile -
      --log-level info
      --timeout 120
      --graceful-timeout 30
    environment:
      - DATABASE_URL=postgresql+asyncpg://lazy_bird:${DB_PASSWORD}@postgres:5432/lazy_bird
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - CORS_ORIGINS=${CORS_ORIGINS}
    volumes:
      - git_repos:/var/lib/lazy_bird/repos
      - api_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - external
    ports:
      - "127.0.0.1:8000:8000"  # Bind to localhost (use nginx reverse proxy)
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: lazy-bird/api:${VERSION:-latest}
    restart: always
    command: >
      celery -A lazy_bird.tasks.celery_app worker
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=100
      --time-limit=3600
      --soft-time-limit=3000
    environment:
      - DATABASE_URL=postgresql+asyncpg://lazy_bird:${DB_PASSWORD}@postgres:5432/lazy_bird
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    volumes:
      - git_repos:/var/lib/lazy_bird/repos
      - worker_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - external
    deploy:
      replicas: 2  # Run 2 worker instances
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # Celery Beat (Scheduler)
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: lazy-bird/api:${VERSION:-latest}
    container_name: lazy-bird-beat-prod
    restart: always
    command: celery -A lazy_bird.tasks.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://lazy_bird:${DB_PASSWORD}@postgres:5432/lazy_bird
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - beat_data:/app/celerybeat-schedule
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Nginx Reverse Proxy (Optional but recommended)
  nginx:
    image: nginx:alpine
    container_name: lazy-bird-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - api
    networks:
      - external
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

networks:
  # Internal network (database, redis, workers)
  internal:
    driver: bridge
    internal: true  # No internet access
  # External network (API, nginx)
  external:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  git_repos:
    driver: local
  api_logs:
    driver: local
  worker_logs:
    driver: local
  beat_data:
    driver: local
  nginx_cache:
    driver: local
